language: python
cache:
  pip: true
  directories:
    - .ci-replay-cache
matrix:
  include:
    - python: 3.5
    - python: 3.6
    - python: 3.7
install:
  - pip install -r requirements.txt
  - python -m spacy download en_core_web_sm
  - python -m nltk.downloader words
  - python -m nltk.downloader stopwords
  - pip install pytest
  - pip install coverage
  - pip install codecov
  - pip install flake8
before_script:
  - "flake8 pyresparser"
script:
  - >-
    CI_REPLAY_LANE="py${TRAVIS_PYTHON_VERSION}"
    CI_REPLAY_CACHE_DIR="$PWD/.ci-replay-cache"
    timeout --signal=TERM --kill-after=30s 45m
    coverage run -m pytest -p ci_replay --maxfail=1
after_success:
  - codecov
